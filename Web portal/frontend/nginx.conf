# nginx for the Docker setup: the portal's files, plus the backend behind it.
#   /          the React portal (built files)
#   /api/      the Django backend: portal API, the app's GraphQL, photo uploads
#   /static/   the Django admin's CSS/JS (collected into the backend image)
server {
    listen 80;
    server_name _;

    # Report photos may be up to 15 MB (mobile/reports.py); allow a little more.
    client_max_body_size 16m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        # Pass the original host name on: Django checks it (ALLOWED_HOSTS).
        proxy_set_header Host $http_host;
        # The real client address, for rate limits and the audit log
        # (config/proxy.py). Overwritten, never appended: a client-sent
        # X-Forwarded-For must not get through.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The first photo check loads the YOLO model (a few seconds).
        proxy_read_timeout 120s;
    }

    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
    }

    # Single-page app: unknown paths (e.g. /reports, /map) load index.html,
    # and React's router shows the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
