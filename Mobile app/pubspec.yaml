name: roadguard_ai
description: RoadGuard AI traveler mobile app — local-first client preview.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.4
  geolocator: ^14.0.3
  image_picker: ^1.2.3
  image: ^4.10.1
  flutter_tts: ^4.2.5
  sensors_plus: ^7.1.0
  permission_handler: ^12.0.1
  cryptography: ^2.7.0
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/welcome_road.png
